name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" on main = test + redeploy

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: it may be halfway through a deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: promo
          POSTGRES_PASSWORD: promo
          POSTGRES_DB: promo_gate_test # name must end in _test: the test reset refuses anything else
          TZ: UTC
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U promo -d promo_gate_test"
          --health-interval 2s --health-timeout 3s --health-retries 30

    env:
      CI: "true"
      DATABASE_URL: postgresql://promo:promo@localhost:5435/promo_gate_test?schema=public
      TEST_DATABASE_URL: postgresql://promo:promo@localhost:5435/promo_gate_test?schema=public
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci # postinstall: prisma generate + self-hosted QR wasm

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Every API route has an auth check
        run: npm run check:auth

      - name: Unit tests (resets the test DB)
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E happy path (390px)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Production build
        run: npm run build

  # Deploys main to the cPanel server once every check above passed. Skipped until the repository variable
  # CPANEL_HOST is set. One-time server setup: docs/DEPLOY-CPANEL.md.
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CPANEL_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      # Build-time placeholders only (every page renders at request time; real values live in ~/perks/shared/.env).
      DATABASE_URL: postgresql://build:build@localhost:5432/build
      SESSION_SECRET: build-only-placeholder-0123456789abcdef
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_OUTPUT: standalone

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (standalone)
        run: npm run build

      - name: Package release
        run: bash deploy/cpanel/package.sh release.tgz

      - name: SSH key
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

      - name: Upload and activate
        env:
          HOST: ${{ vars.CPANEL_HOST }}
          SSH_USER: ${{ vars.CPANEL_USER }}
          PORT: ${{ vars.CPANEL_SSH_PORT || '22' }}
        run: |
          ID="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          ssh_() { ssh -i ~/.ssh/deploy -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=20 "$SSH_USER@$HOST" "$@"; }
          ssh_ "mkdir -p perks/releases/$ID && tar -xzf - -C perks/releases/$ID" < release.tgz
          ssh_ "bash perks/releases/$ID/deploy/activate.sh"
